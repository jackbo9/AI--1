limit_req_zone $binary_remote_addr zone=poster_requests:10m rate=5r/s;

server {
    listen 80 default_server;
    server_name 47.114.33.166;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://47.114.33.166$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 47.114.33.166;
    ssl_certificate /etc/letsencrypt/live/47.114.33.166/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.114.33.166/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    # OAuth authorization codes and job IDs must not enter URL access logs.
    access_log off;

    location / {
        limit_req zone=poster_requests burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }
}
